[platformio]
default_envs = rtspark_f407zg_hsi
src_dir = firmware/src
include_dir = firmware/include
lib_dir = firmware/lib
test_dir = firmware/test
boards_dir = firmware/boards

[env:rtspark_f407zg_hsi]
; MCU-only foundation; RT-Spark wiring and upload remain UNVERIFIED.
platform = ststm32@20.0.0
board = rtspark_f407zg_hsi
framework = stm32cube
platform_packages =
    platformio/framework-stm32cubef4@1.28.3
    platformio/toolchain-gccarmnoneeabi@1.120301.0
board_build.ldscript = firmware/boards/stm32f407zg_foundation.ld
extra_scripts = pre:tools/freertos_build.py
build_flags =
    -mfpu=fpv4-sp-d16
    -mfloat-abi=hard
    -Wextra
    -Wl,-Map,.pio/build/rtspark_f407zg_hsi/firmware.map
